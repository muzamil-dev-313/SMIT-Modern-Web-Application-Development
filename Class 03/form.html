<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <form action="">

        <label for="">Full Name</label>
        <input type="text" required>
        <input type="checkbox"> Before to submit first check the box. <br>
        <input type="color">
        <input type="date">
        <input type="datetime" placeholder="Enter datetime">
        <input type="datetime-local">
        <input type="file" required>
        <label for="">Email</label>
        <input type="email">
        <input type="button" value="Click me!"> <br>
        <input type="submit" value="registered now">
    </form>

    <!-- **Job Application Form (Practice Question)**

    Design a **Job Application Form** that includes the following input types:

    * Full Name (Text input)
    * Email Address (Email input)
    * Phone Number (Telephone input)
    * Date of Birth (Date input)
    * Password (Password input)
    * Gender (Radio buttons)
    * Position Applying For (Dropdown/Select)
    * Years of Experience (Number input)
    * Skills (Checkboxes – e.g., HTML, CSS, JavaScript, Python)
    * Preferred Interview Time (Time input)
    * Available Start Date (Date input)
    * Upload Resume (File input)
    * Personal Website or Portfolio (URL input)
    * Favorite Color (Color picker)
    * Expected Salary (Range input)
    * Cover Letter (Textarea)
    * Agree to Terms and Conditions (Checkbox)
    * Submit button -->

    <h1>Form For Job Application</h1>
    <form action="">
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" placeholder="Enter your full name"> <br> <br>

        <label for="Email">Email:</label>
        <input type="email" id="Email" placeholder="Enter your email"> <br> <br>

        <label for="phoneNumber">Phone Number:</label>
        <input type="tel" id="phoneNumber" placeholder="Enter your phone"> <br> <br>

        <label for="DOB">Date of Birth:</label>
        <input type="date" id="DOB" placeholder="Enter your full name"> <br> <br>

        <label for="pass">Password:</label>
        <input type="password" id="pass" placeholder="Type your password"> <br> <br>

        <input type="radio" id="male" name="Gender" value="male">
        <label for="male">Male</label> <br>

        <input type="radio" id="female" name="Gender" value="female">
        <label for="female">Female</label> <br>

        <input type="radio" id="other" name="Gender" value="other">
        <label for="other">Other</label> <br>

        <label for="job_category">Choose a job category:</label> <br> <br>
        <select name="job_category" id="job_category">
            <option value="">--Please choose an option--</option>
            <option value="tech">Technology & IT</option>
            <option value="healthcare">Healthcare & Medical</option>
            <option value="finance">Finance & Accounting</option>
            <option value="education">Education & Training</option>
            <option value="sales">Sales & Marketing</option>
            <option value="creative">Creative & Design</option>
            <option value="admin">Administrative & Clerk</option>
            <option value="engineering">Engineering & Architecture</option>
            <option value="legal">Legal Services</option>
            <option value="hospitality">Hospitality & Tourism</option>
        </select>

        

    </form>
</body>

</html>
