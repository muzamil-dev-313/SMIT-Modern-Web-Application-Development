<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Lecture 05 Practice</title>

    <style>

        /* Tag Selector */
        h1{
            color: blue;
            text-align: center;
        }

        /* Class Selector */
        .box{
            background-color: lightblue;
            border: 3px solid blue;
            text-align: center;
        }

        /* ID Selector */
        #title{
            color: red;
        }

        /* Div Selector */
        div{
            padding: 15px;
            margin: 10px;
        }

        /* Span Selector */
        .highlight{
            color: green;
            font-weight: bold;
        }

        body{
            background-color: #f2f2f2;
        }

    </style>
</head>
<body>

    <h1>Welcome to CSS</h1>

    <h2 id="title">ID Selector Example</h2>

    <div class="box">
        This is a DIV with Class Selector.
    </div>

    <p>
        CSS makes websites
        <span class="highlight">
            beautiful
        </span>
        and professional.
    </p>

    <p style="color: purple;">
        This is Inline CSS Example.
    </p>

</body>
</html>
